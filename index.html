<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14361f">
<title>Orman Koşusu 3D</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#14361f; touch-action:none; -webkit-user-select:none; user-select:none; font-family: "Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif; color:#fff; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hidden { display:none !important; }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px); z-index:20; }
  .spacer { flex:1; }
  h1 { margin:0; font-size:52px; line-height:.95; letter-spacing:1px; text-align:center; color:#ffd23f; -webkit-text-stroke: 3px #5a2d0c; text-shadow: 0 6px 0 #5a2d0c, 0 10px 18px rgba(0,0,0,.45); font-weight:900; }
  .subtitle { margin-top:10px; font-size:18px; font-weight:bold; text-shadow:0 2px 0 #2c1606, 0 3px 8px rgba(0,0,0,.5); text-align:center; }
  .panel { width:100%; max-width:420px; background:rgba(255,248,231,.96); color:#4a2a10; border-radius:26px; padding:16px; border:4px solid #8d5a2b; box-shadow: 0 10px 0 #5f3a17, 0 16px 30px rgba(0,0,0,.4); }
  .row { display:flex; gap:10px; margin-top:10px; }
  button { font-family:inherit; border:none; cursor:pointer; }
  .big { flex:1; width:100%; font-size:28px; font-weight:900; color:#fff; padding:14px 10px; border-radius:20px; letter-spacing:1px; text-shadow:0 2px 0 rgba(0,0,0,.25); transition: transform .08s; }
  .big:active { transform: translateY(4px); }
  .green { background:linear-gradient(#5be38c,#22b85a); box-shadow:0 6px 0 #14803c; }
  .blue { background:linear-gradient(#5fb8ff,#2c7fe0); box-shadow:0 6px 0 #1b56a3; }
  .orange { background:linear-gradient(#ffb15c,#f07c1e); box-shadow:0 6px 0 #a94f0b; }
  .purple { background:linear-gradient(#c58cff,#8b4fe0); box-shadow:0 6px 0 #5b2ca3; }
  .seg { flex:1; font-size:18px; font-weight:bold; padding:10px; border-radius:14px; background:#f3e2c0; color:#6b4420; box-shadow:0 4px 0 #c9a774; }
  .seg.on { background:linear-gradient(#ffd75e,#f5b315); color:#5a2d0c; box-shadow:0 4px 0 #b07c06; }
  .icon { width:64px; flex:0 0 64px; font-size:26px; border-radius:20px; background:#f3e2c0; box-shadow:0 6px 0 #c9a774; }
  .lvrow { display:flex; align-items:center; gap:12px; }
  .lvbig { width:62px; height:62px; flex:0 0 62px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff3a1, #f5b315 60%, #c98a04); border:4px solid #8d5a2b; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:900; color:#5a2d0c; }
  .lvinfo { flex:1; }
  .lvinfo b { font-size:20px; }
  .xpbar { height:16px; border-radius:10px; background:#e2cfa6; overflow:hidden; margin:5px 0 3px; border:2px solid #b8935a; }
  .xpbar i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#7be36b,#2fbf5a); border-radius:8px; transition: width .6s; }
  .small { font-size:14px; color:#7a5530; }
  .stats { text-align:center; margin-top:10px; font-weight:bold; }

  /* GARAJ */
  .gtop { width:100%; max-width:420px; display:flex; align-items:center; gap:10px; }
  .gtop h2 { flex:1; margin:0; text-align:center; font-size:34px; color:#ffd23f; -webkit-text-stroke:2px #5a2d0c; text-shadow:0 4px 0 #5a2d0c; font-weight:900; }
  .back { width:56px; height:56px; border-radius:18px; font-size:26px; background:#fff8e7; color:#5a2d0c; box-shadow:0 5px 0 #c9a774; font-weight:900; }
  .pill { min-width:56px; padding:8px 12px; border-radius:18px; background:#ffd23f; color:#5a2d0c; font-weight:900; font-size:18px; text-align:center; box-shadow:0 5px 0 #b07c06; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button { flex:1; padding:10px 2px; border-radius:12px; font-size:15px; font-weight:bold; background:#f3e2c0; color:#6b4420; box-shadow:0 3px 0 #c9a774; }
  .tabs button.on { background:#8d5a2b; color:#fff; box-shadow:0 3px 0 #5f3a17; }
  .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; max-height: 34vh; overflow-y:auto; }
  .card { position:relative; background:#fff; border-radius:16px; padding:8px 4px 6px; text-align:center; border:3px solid #e2cfa6; }
  .card .ic { font-size:38px; line-height:1.15; }
  .card .nm { font-size:13px; font-weight:bold; color:#4a2a10; }
  .card.sel { border-color:#22b85a; background:#eaffef; box-shadow:0 0 0 3px #7be36b inset; }
  .card.locked { filter: grayscale(1); opacity:.6; }
  .card .lock { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:13px; background:rgba(60,40,20,.55); color:#fff; font-weight:900; font-size:13px; }
  .card .lock span { font-size:24px; }
  #itemInfo { text-align:center; min-height:20px; margin-top:8px; font-weight:bold; }

  /* HUD */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; padding: calc(env(safe-area-inset-top) + 8px) 10px 0; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #hearts { display:flex; gap:2px; }
  #hearts svg { width:26px; height:26px; filter: drop-shadow(0 2px 1px rgba(0,0,0,.35)); }
  .chip { background:rgba(40,22,8,.55); border-radius:16px; padding:4px 10px; font-weight:900; font-size:20px; display:flex; align-items:center; gap:6px; text-shadow:0 2px 0 rgba(0,0,0,.4); }
  #pauseBtn { pointer-events:auto; width:44px; height:44px; border-radius:14px; background:rgba(40,22,8,.55); color:#fff; font-size:18px; font-weight:900; }
  .subbar { display:flex; align-items:center; gap:8px; margin-top:6px; }
  #lvBadge { background:#ffd23f; color:#5a2d0c; border-radius:12px; padding:2px 8px; font-weight:900; font-size:15px; box-shadow:0 3px 0 #b07c06; }
  #hudXp { flex:1; height:10px; border-radius:6px; background:rgba(0,0,0,.35); overflow:hidden; }
  #hudXp i { display:block; height:100%; width:0; background:linear-gradient(90deg,#7be36b,#2fbf5a); transition: width .4s; }
  #shields { font-size:18px; min-width:20px; }
  #qcard { margin:10px auto 0; width: fit-content; min-width:200px; padding:8px 26px; background:linear-gradient(#fffaf0,#ffeacb); color:#4a2a10; border:5px solid #8d5a2b; border-radius:22px; font-size:44px; font-weight:900; text-align:center; box-shadow:0 7px 0 #5f3a17, 0 12px 20px rgba(0,0,0,.35); transform-origin: 50% 0; transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .2s; }
  #qcard.off { transform: scale(.4); opacity:0; }
  #rideBar { margin:12px auto 0; width:220px; display:flex; align-items:center; gap:8px; background:rgba(40,22,8,.55); padding:6px 10px; border-radius:16px; }
  #rideBar span { font-size:24px; }
  #rideBar .bar { flex:1; height:12px; background:rgba(255,255,255,.25); border-radius:8px; overflow:hidden; }
  #rideBar .bar i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#ffd23f,#ff8a3d); }
  #laneHint { position:absolute; left:0; right:0; bottom: calc(env(safe-area-inset-bottom) + 90px); text-align:center; font-size:22px; font-weight:900; text-shadow: 0 3px 0 rgba(0,0,0,.5); animation: pulse 0.8s infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
  #banner { position:fixed; left:0; right:0; top:34%; text-align:center; z-index:15; pointer-events:none; font-size:38px; font-weight:900; color:#fff; -webkit-text-stroke:2px #1c4a2a; text-shadow:0 5px 0 #1c4a2a, 0 8px 16px rgba(0,0,0,.45); opacity:0; transform:scale(.5); transition: opacity .25s, transform .35s cubic-bezier(.3,1.6,.5,1); padding:0 12px; line-height:1.15; }
  #banner.show { opacity:1; transform:scale(1); }
  #banner.red { -webkit-text-stroke-color:#7a1414; text-shadow:0 5px 0 #7a1414, 0 8px 16px rgba(0,0,0,.45); }
  #banner.gold { color:#ffe14d; -webkit-text-stroke-color:#6b3a00; text-shadow:0 5px 0 #6b3a00, 0 8px 16px rgba(0,0,0,.45); }
  #banner small { display:block; font-size:22px; margin-top:6px; }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:14; transition: opacity .35s; }
  .ovTitle { font-size:34px; font-weight:900; color:#4a2a10; text-align:center; margin:4px 0 8px; }
  .ovStats { display:flex; justify-content:space-around; margin:6px 0 10px; }
  .ovStats div { text-align:center; font-weight:900; font-size:26px; color:#4a2a10; }
  .ovStats small { display:block; font-size:13px; color:#7a5530; font-weight:bold; }
  #ovUnlock { text-align:center; font-weight:900; color:#14803c; min-height:22px; margin-bottom:6px; }
  .center { justify-content:center; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="topbar">
    <div id="hearts"></div>
    <div class="chip">🍌 <span id="bananaCount">0</span></div>
    <button id="pauseBtn">❚❚</button>
  </div>
  <div class="subbar">
    <div id="lvBadge">Sv 1</div>
    <div id="hudXp"><i></i></div>
    <div id="shields"></div>
  </div>
  <div id="qcard" class="off"><span id="qtext"></span></div>
  <div id="rideBar" class="hidden"><span id="rideIcon">✈️</span><div class="bar"><i id="rideFill"></i></div></div>
  <div id="laneHint" class="hidden">⬅ Doğru sayının altından geç ➡</div>
</div>
<div id="banner"></div>
<div id="flash"></div>

<!-- ANA MENÜ -->
<div id="menu" class="screen">
  <h1>ORMAN<br>KOŞUSU</h1>
  <div class="subtitle">Maymun'un Büyük Macerası</div>
  <div class="spacer"></div>
  <div class="panel">
    <div class="lvrow">
      <div class="lvbig" id="mLv">1</div>
      <div class="lvinfo"><b id="mLvText">Seviye 1</b><div class="xpbar"><i id="mXp"></i></div><div class="small" id="mNext"></div></div>
    </div>
    <div class="row"><button class="seg" data-mode="kucuk">1. Sınıf</button><button class="seg" data-mode="buyuk">3. Sınıf</button></div>
    <div class="row"><button class="big green" id="playBtn">OYNA</button></div>
    <div class="row"><button class="big blue" id="garageBtn">🛠️ GARAJ</button><button class="icon" id="muteBtn">🔊</button></div>
    <div class="stats small" id="mStats"></div>
  </div>
</div>

<!-- GARAJ -->
<div id="garage" class="screen hidden">
  <div class="gtop"><button class="back" id="gBack">⬅</button><h2>GARAJ</h2><div class="pill" id="gLv">Sv 1</div></div>
  <div class="spacer"></div>
  <div class="panel">
    <div class="tabs">
      <button data-tab="vehicle" class="on">Araçlar</button>
      <button data-tab="armor">Zırhlar</button>
      <button data-tab="hat">Şapkalar</button>
      <button data-tab="power">Güçler</button>
    </div>
    <div id="itemGrid" class="grid"></div>
    <div id="itemInfo" class="small"></div>
  </div>
</div>

<!-- MOLA -->
<div id="pause" class="screen center hidden" style="background:rgba(0,0,0,.45)">
  <div class="panel">
    <div class="ovTitle">Mola</div>
    <div class="row"><button class="big green" id="resumeBtn">DEVAM</button></div>
    <div class="row"><button class="big blue" id="pMuteBtn">🔊 SES</button></div>
    <div class="row"><button class="big orange" id="pMenuBtn">ANA MENÜ</button></div>
  </div>
</div>

<!-- OYUN SONU -->
<div id="over" class="screen center hidden" style="background:rgba(0,0,0,.45)">
  <div class="panel">
    <div class="ovTitle">Çok iyi koştun!</div>
    <div class="ovStats">
      <div><span id="ovCorrect">0</span><small>doğru</small></div>
      <div><span id="ovBanana">0</span><small>muz</small></div>
      <div><span id="ovXp">0</span><small>tecrübe</small></div>
    </div>
    <div class="lvrow"><div class="lvbig" id="ovLv">1</div><div class="lvinfo"><b id="ovLvText">Seviye 1</b><div class="xpbar"><i id="ovXpBar"></i></div></div></div>
    <div id="ovUnlock"></div>
    <div class="row"><button class="big green" id="againBtn">TEKRAR</button></div>
    <div class="row"><button class="big blue" id="oGarageBtn">🛠️ GARAJ</button><button class="big orange" id="oMenuBtn">MENÜ</button></div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   ORMAN KOŞUSU 3D  -  Maymun'un Büyük Macerası
   Three.js r160, tek dosya, harici resim/ses yok (her şey kodla).
   6-8 yaş toplama/çıkarma + 3 şeritli 3B koşu + araçlar + garaj.
   ===================================================================== */
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (k, dt) => 1 - Math.exp(-k * dt);
function weighted(list) { let s = 0; list.forEach(x => s += x[1]); let r = Math.random() * s; for (const x of list) { if ((r -= x[1]) <= 0) return x[0]; } return list[0][0]; }

/* ---------------------------- KAYIT ---------------------------- */
const Save = {
  d: null,
  load() {
    let x = {};
    try { x = JSON.parse(localStorage.getItem('orman3d_v1') || '{}'); } catch (e) {}
    this.d = Object.assign({ xp: 0, bananas: 0, best: 0, mode: 'kucuk', vehicle: 'jet', armor: 'tisort', hat: 'yok', magnet: true, superjump: true, muted: false, runs: 0 }, x);
  },
  save() { try { localStorage.setItem('orman3d_v1', JSON.stringify(this.d)); } catch (e) {} }
};
Save.load();

/* ---------------------------- SEVİYE / EŞYA ---------------------------- */
const xpFor = L => 20 * (L - 1) * L;               // Sv2: 40, Sv3: 120, Sv4: 240 ...
const levelOf = xp => { let L = 1; while (xp >= xpFor(L + 1)) L++; return L; };
const ITEMS = {
  vehicle: [
    { id: 'jet', name: 'Jet', icon: '✈️', lv: 1, desc: 'Gökyüzünde uç, havadaki muzları topla' },
    { id: 'kaykay', name: 'Roket Kaykay', icon: '🛹', lv: 2, desc: 'Çok hızlı, engelleri parçalar' },
    { id: 'tekne', name: 'Sürat Teknesi', icon: '🚤', lv: 5, desc: 'Yol nehre döner, suda süzül' },
    { id: 'denizalti', name: 'Denizaltı', icon: '🤿', lv: 7, desc: 'Su altına dal, balıkları gör' },
    { id: 'roket', name: 'Uzay Roketi', icon: '🚀', lv: 9, desc: 'Yıldızların arasına çık' }
  ],
  armor: [
    { id: 'tisort', name: 'Tişört', icon: '👕', lv: 1, shield: 0, desc: 'Kalkan yok' },
    { id: 'tahta', name: 'Tahta Zırh', icon: '🪵', lv: 3, shield: 1, desc: 'Her haritada 1 kalkan' },
    { id: 'demir', name: 'Demir Zırh', icon: '🛡️', lv: 6, shield: 2, desc: 'Her haritada 2 kalkan' },
    { id: 'altin', name: 'Altın Zırh', icon: '🏆', lv: 10, shield: 3, desc: 'Her haritada 3 kalkan' }
  ],
  hat: [
    { id: 'yok', name: 'Şapkasız', icon: '🐵', lv: 1, desc: 'Doğal görünüm' },
    { id: 'kaptan', name: 'Kaptan Şapkası', icon: '🧢', lv: 4, desc: 'Gerçek bir kaptan gibi' },
    { id: 'tac', name: 'Kral Tacı', icon: '👑', lv: 11, desc: 'Ormanın kralı' },
    { id: 'kask', name: 'Pilot Kaskı', icon: '⛑️', lv: 13, desc: 'Usta pilotlar için' }
  ],
  power: [
    { id: 'magnet', name: 'Muz Mıknatısı', icon: '🧲', lv: 8, desc: 'Yakındaki muzları kendine çeker' },
    { id: 'superjump', name: 'Süper Zıplama', icon: '🦘', lv: 12, desc: 'Daha yükseğe zıpla' }
  ]
};
const itemById = (cat, id) => ITEMS[cat].find(i => i.id === id);
function unlocksAt(L) { const r = []; Object.keys(ITEMS).forEach(c => ITEMS[c].forEach(i => { if (i.lv === L) r.push({ cat: c, item: i }); })); return r; }
function nextUnlock(L) { for (let k = L + 1; k < 30; k++) { const u = unlocksAt(k); if (u.length) return { lv: k, list: u }; } return null; }
function powerOn(id) { return levelOf(Save.d.xp) >= itemById('power', id).lv && Save.d[id]; }

/* ---------------------------- MATEMATİK ---------------------------- */
function makeQuestion(level) {
  let a, b, op, ans;
  if (level === 1) { a = rndi(1, 9); b = rndi(1, 10 - a); op = '+'; ans = a + b; }
  else if (level === 2) { a = rndi(2, 15); b = rndi(1, 20 - a); op = '+'; ans = a + b; }
  else if (Math.random() < .5) { a = rndi(2, 15); b = rndi(1, 20 - a); op = '+'; ans = a + b; }
  else { a = rndi(3, 20); b = rndi(1, a - 1); op = '-'; ans = a - b; }
  let wrong, g = 0;
  do { wrong = ans + rndi(1, 3) * (Math.random() < .5 ? -1 : 1); } while ((wrong < 0 || wrong > 20 || wrong === ans) && g++ < 50);
  const options = Math.random() < .5 ? [ans, wrong] : [wrong, ans];
  return { ans, options, text: `${a} ${op} ${b} = ?` };
}
const levelForRun = (mode, c) => mode === 'kucuk' ? 1 : (c >= 12 ? 3 : c >= 6 ? 2 : 1);

/* ---------------------------- SES ---------------------------- */
const Audio = {
  ctx: null, master: null, amb: [], ambTimers: [], loop: null, music: { timer: null, step: 0 },
  init() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination); } catch (e) { return; }
    }
    this.master.gain.value = Save.d.muted ? 0 : 0.9;
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  setMuted(m) { Save.d.muted = m; Save.save(); if (this.master) this.master.gain.value = m ? 0 : 0.9; },
  tone(f, dur, type = 'sine', vol = .2, when = 0, slide = 0) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain(), t = this.ctx.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + .05);
  },
  nbuf() { if (this._nb) return this._nb; const n = this.ctx.sampleRate * 2, b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; return (this._nb = b); },
  noise(type, freq, vol, dur, when = 0, q = 1) {
    if (!this.ctx) return null;
    const s = this.ctx.createBufferSource(); s.buffer = this.nbuf(); s.loop = true;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain(), t = this.ctx.currentTime + when;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.4, (dur || 1) * .3));
    if (dur) g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); if (dur) s.stop(t + dur + .1);
    return { s, g, f };
  },
  fade(n) { if (!n || !this.ctx) return; try { n.g.gain.cancelScheduledValues(this.ctx.currentTime); n.g.gain.setValueAtTime(Math.max(.0001, n.g.gain.value), this.ctx.currentTime); n.g.gain.exponentialRampToValueAtTime(.0001, this.ctx.currentTime + .5); n.s.stop(this.ctx.currentTime + .6); } catch (e) {} },
  // efektler
  banana(c) { const f = 880 * Math.pow(1.06, Math.min(c, 12)); this.tone(f, .08, 'sine', .14); this.tone(f * 1.5, .1, 'sine', .1, .05); },
  correct() { [660, 880, 1320].forEach((f, i) => this.tone(f, .2, 'sine', .22, i * .09)); this.tone(1760, .35, 'triangle', .1, .27); },
  wrong() { this.tone(260, .25, 'triangle', .14, 0, -80); this.tone(200, .35, 'triangle', .12, .18, -60); },

  // ortam sesi

  startLoop(kind) {

  },

};

function buildChaser(kind) {
  const g = new THREE.Group(); g.userData.kind = kind;
  if (kind === 'boulder') { const r = mesh(new THREE.DodecahedronGeometry(2.4, 1), mat(0x7d7d7d)); r.position.y = 2.4; g.add(r); g.userData.roll = r; for (let i = 0; i < 8; i++) r.add(sph(rnd(.3, .6), mat(0x5f5f5f), ...new V3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize().multiplyScalar(2.2).toArray(), 1, 1, 1, 6)); }
  if (kind === 'rhino') {
    const gray = mat(0x8a8f96);
    g.add(sph(1.5, gray, 0, 2, 0, 1.1, .9, 1.6, 10));
    const head = sph(.9, gray, 0, 2.2, -2.2, 1, .85, 1.2, 10); g.add(head);
    const h1 = mesh(new THREE.ConeGeometry(.3, 1.2, 8), smooth(0xf5f0e0), 0, 2.6, -3.2); h1.rotation.x = -.6; g.add(h1);
    const h2 = mesh(new THREE.ConeGeometry(.18, .6, 8), smooth(0xf5f0e0), 0, 2.9, -2.7); h2.rotation.x = -.3; g.add(h2);
    [-1, 1].forEach(s => { g.add(sph(.12, smooth(0xffffff), .45 * s, 2.55, -2.85)); g.add(sph(.07, smooth(0xb71c1c), .47 * s, 2.55, -2.95)); g.add(mesh(new THREE.ConeGeometry(.18, .4, 6), gray, .55 * s, 3.05, -1.9)); });
    const legs = []; [[-.8, -1.2], [.8, -1.2], [-.8, 1.2], [.8, 1.2]].forEach(([x, z]) => { const l = mesh(new THREE.CylinderGeometry(.35, .3, 1.3, 8), gray, x, .65, z); g.add(l); legs.push(l); }); g.userData.legs = legs;
    g.scale.setScalar(1.15);
  }
  if (kind === 'wave') {
    const blue = smooth(0x2f8fd0, { transparent: true, opacity: .92 }), light = smooth(0x5fb8ff, { transparent: true, opacity: .9 }), white = smooth(0xffffff);
    const wall = mesh(new THREE.BoxGeometry(18, 4.6, 3), blue, 0, 2.3, .8); g.add(wall);
    const back = mesh(new THREE.BoxGeometry(18, 3, 4), light, 0, 1.5, 3); back.rotation.x = -.35; g.add(back);
    const curl = mesh(new THREE.CylinderGeometry(1.5, 1.5, 18, 18, 1, true, Math.PI * .5, Math.PI * 1.25), smooth(0x2f8fd0, { side: THREE.DoubleSide }), 0, 4.6, -.3); curl.rotation.z = Math.PI / 2; g.add(curl);
    for (let i = 0; i < 22; i++) g.add(sph(rnd(.35, .75), white, rnd(-8.5, 8.5), rnd(5.2, 6.1), rnd(-1.2, .6), 1, 1, 1, 8));
    for (let i = 0; i < 12; i++) g.add(sph(rnd(.3, .6), white, rnd(-8.5, 8.5), rnd(.2, .7), rnd(-1, -.5), 1, 1, 1, 8));
    g.userData.foam = g.children.slice(3);
  }
  return g;
}
function startChase() {
  const kind = BIOMES[G.biomeIdx].chaser;
  chaser = buildChaser(kind); chaser.position.set(0, 0, 34); scene.add(chaser);
  G.chase = { phase: 'warn', t: 0, kind };

}
function updateChase(dt) {
  const c = G.chase; c.t += dt;
  const z = c.phase === 'escape' ? chaser.position.z + 25 * dt : c.t < 2.6 ? lerp(34, 10, c.t / 2.6) : lerp(10, 6.5, Math.min(1, (c.t - 2.6) / 2));
  chaser.position.z = z; chaser.position.x = lerp(chaser.position.x, G.px * .5, damp(1.5, dt));
  if (chaser.userData.roll) chaser.userData.roll.rotation.x -= G.speed * dt / 2.4;
  if (chaser.userData.legs) chaser.userData.legs.forEach((l, i) => l.position.y = .65 + Math.abs(Math.sin(G.t * 14 + i * 1.6)) * .3);
  if (chaser.userData.kind === 'wave') chaser.position.y = Math.sin(G.t * 4) * .2;
  if (c.phase === 'warn' && c.t > 2.6) { c.phase = 'run'; }
  if (c.phase === 'run' && c.t > 4.3) {
    c.phase = 'escape'; Audio.stopChaseLoop(); Audio.startMusic('run');

   KAMERA
   ===================================================================== */
const camPos = new V3(0, 4, 9), camLook = new V3(0, 1, -8);
function updateCamera(dt) {
  const p = playerRoot.position; let off, look, k = 3.5;
  if (G.state === 'menu') { const a = G.t * .25; off = new V3(Math.sin(a) * 1.2, 2.1, 5.2); look = new V3(0, 1.0, 0); camPos.lerp(new V3(p.x, 0, p.z).add(off), damp(2, dt)); camLook.lerp(look.add(new V3(p.x, 0, p.z)), damp(3, dt)); camera.position.copy(camPos); camera.lookAt(camLook); return; }
  if (G.state === 'garage') { const a = G.t * .5; off = new V3(Math.sin(a) * 6.2, 3, Math.cos(a) * 6.2); look = new V3(0, -.6, 0); camPos.lerp(off, damp(3, dt)); camLook.lerp(look, damp(3, dt)); camera.position.copy(camPos); camera.lookAt(camLook); return; }
  if (G.chase && G.chase.phase === 'warn') { off = new V3(2.8, 1.8, -5.5); look = new V3(p.x, p.y + 1.6, p.z + 6); k = 2.5; }
  else if (G.chase && G.chase.phase === 'run') { off = new V3(6, 4.5, 3); look = new V3(p.x, p.y + 1, p.z + 3); k = 2.5; }
  else if (G.riding) { const c = RIDE[G.riding].cam; off = new V3(c[0], c[1], c[2]); look = new V3(p.x * .5, p.y + .6, p.z - 12); k = 2.2; }
  else if (gate && gate.position.z > -35 && !gate.userData.done) { off = new V3(0, 2.9, 6.3); look = new V3(p.x * .6, 2.2, p.z - 10); }
  else { off = new V3(0, 3.5, 7.6); look = new V3(p.x * .6, 1.2, p.z - 9); }
  const ev = G.camEvent;
  if (ev) {
    ev.t += dt; const u = ev.t / ev.dur, s = Math.sin(Math.min(1, u) * Math.PI);
    if (ev.type === 'pano') { off.y += 4.5 * s; off.z += 7 * s; off.x += 3 * s; }
    if (ev.type === 'punch') { off.z -= 1.4 * s; off.y -= .4 * s; }
    if (ev.type === 'orbit') { const a = Math.min(1, u) * Math.PI * 2; off = new V3(Math.sin(a) * 6, 2.6 + s, Math.cos(a) * 6.5); look = new V3(p.x, p.y + 1.2, p.z); k = 6; }
    if (u >= 1) G.camEvent = null;
  }
  const target = new V3(p.x * (G.riding ? .5 : .55), G.riding ? p.y : 0, 0).add(off);
  camPos.lerp(target, damp(k, dt)); camLook.lerp(look, damp(k + 1, dt));
  camera.position.copy(camPos);
  if (G.shake > 0) { camera.position.x += rnd(-1, 1) * G.shake * .5; camera.position.y += rnd(-1, 1) * G.shake * .5; }
  camera.lookAt(camLook);
}

function poseMonkey(mode, t, sf = 1) {
  const m = monkey;
  m.armL.rotation.set(0, 0, -.18); m.armR.rotation.set(0, 0, .18); m.legL.rotation.set(0, 0, 0); m.legR.rotation.set(0, 0, 0); m.root.position.y = 0; m.head.rotation.set(0, 0, 0);
  m.tail.rotation.y = Math.sin(t * 5) * .35;
  if (mode === 'run') {
    const w = t * 13 * sf, s = Math.sin(w);
    m.legL.rotation.x = s * .95; m.legR.rotation.x = -s * .95; m.armL.rotation.x = -s * .9; m.armR.rotation.x = s * .9;
    m.root.position.y = Math.abs(Math.cos(w)) * .13; m.root.rotation.x = -.12; m.head.rotation.x = .1;
  } else if (mode === 'jump') {
    m.legL.rotation.x = 1.1; m.legR.rotation.x = .6; m.armL.rotation.z = -2.6; m.armR.rotation.z = 2.6; m.root.rotation.x = 0;
  } else if (mode === 'sit') {
    m.legL.rotation.x = 1.45; m.legR.rotation.x = 1.45; m.armL.rotation.x = 1.2; m.armR.rotation.x = 1.2; m.root.rotation.x = 0; m.root.position.y = Math.sin(t * 6) * .03;
  } else if (mode === 'board') {
    m.legL.rotation.z = -.25; m.legR.rotation.z = .25; m.armL.rotation.z = -1.3; m.armR.rotation.z = 1.3; m.root.rotation.x = -.15; m.root.position.y = Math.sin(t * 8) * .04;
  } else if (mode === 'wave') {
    m.armR.rotation.z = 2.6 + Math.sin(t * 7) * .35; m.root.position.y = Math.sin(t * 2) * .03; m.root.rotation.x = 0; m.head.rotation.z = Math.sin(t * 1.5) * .1;
  } else { m.root.rotation.x = 0; m.root.position.y = Math.sin(t * 2) * .03; }
}

/* =====================================================================

function scrollGround(dz) {
  roadMat.map.offset.y += dz / ROAD_TILE;
  sideMat.map.offset.y += dz / SIDE_TILE;
  if (sideMat.map === TEX.water) sideMat.map.offset.x += .0015;
}
function moveAll(list, dz, limit = 14) { for (let i = list.length - 1; i >= 0; i--) { const o = list[i]; o.position.z += dz; if (o.position.z > limit || !o.parent) { if (o.parent) disposeObj(o); list.splice(i, 1); } } }

function updatePlay(dt) {
  G.t += dt;
  const chaseMul = G.chase && G.chase.phase !== 'escape' ? 1.18 : 1;
  const targetSpeed = G.baseSpeed * (G.riding ? RIDE[G.riding].speed : 1) * chaseMul;
  G.speed = lerp(G.speed, targetSpeed, damp(2, dt));
  const dz = G.speed * dt; G.dist += dz;
  scrollGround(dz);

  // oyuncu
  const tx = LANE_X[G.lane]; G.px = lerp(G.px, tx, damp(13, dt));
  playerRoot.position.x = G.px;
  if (G.riding) {
    const r = RIDE[G.riding]; let ty = r.y + (r.y > 1 ? Math.sin(G.t * 2.5) * .25 : 0);
    if (G.riding === 'tekne') ty = Math.sin(G.t * 3) * .08;
    G.py = lerp(G.py, ty, damp(3, dt)); G.vy = 0; G.grounded = true;
  } else {
    G.vy -= GRAV * dt; G.py += G.vy * dt;
    if (G.py <= 0) { if (!G.grounded && G.vy < -4) Audio.land(); G.py = 0; G.vy = 0; G.grounded = true; }
  }
  playerRoot.position.y = G.py;
  const tilt = (tx - G.px) * -.18;
  playerRoot.rotation.z = lerp(playerRoot.rotation.z, tilt, damp(10, dt));
  shadow.position.set(G.px, G.underwater ? .02 : (G.boatWater ? .04 : .02), 0); shadow.scale.setScalar(Math.max(.3, 1 - G.py * .08)); shadow.visible = !G.space;
  if (G.riding) {
    const v = vehicleHolder.children[0];
    if (v) {
      v.userData.arrive = Math.min(1, (v.userData.arrive || 0) + dt * 2.2); const a = v.userData.arrive;
      v.position.y = lerp(6, 0, a * a * (3 - 2 * a)); v.position.z = lerp(-6, 0, a);
      monkey.g.position.y = v.userData.seat * a; poseMonkey(a > .7 ? v.userData.pose : 'jump', G.t);
      if (v.userData.flames) v.userData.flames.forEach(f => { f.scale.y = rnd(.7, 1.3); });
      if (v.userData.prop) v.userData.prop.rotation.z += dt * 18;
      v.rotation.z = tilt * 1.5; v.rotation.x = G.riding === 'tekne' ? Math.sin(G.t * 3) * .04 : 0;
      if (G.riding === 'tekne' && Math.random() < .5) burst(new V3(G.px, .1, 1.6), 1, [0xffffff, 0xd8f4ff], 2, .5, -4, .8);
      if (G.riding === 'kaykay' && Math.random() < .4) burst(new V3(G.px, .5, 1.9), 1, [0x4fc3f7, 0xffffff], 1.5, .3, 0, .7);
    }
    G.rideT -= dt; $('rideFill').style.width = (100 * G.rideT / RIDE[G.riding].dur) + '%';
    if (G.rideT <= 0) endRide();
  } else {
    monkey.g.position.y = 0;
    poseMonkey(G.grounded ? 'run' : 'jump', G.t, G.speed / 14);
  }
  if (G.invuln > 0) { G.invuln -= dt; monkey.g.visible = Math.floor(G.invuln * 12) % 2 === 0 || G.invuln <= 0; } else monkey.g.visible = true;
  shieldBubble.visible = G.shields > 0; if (shieldBubble.visible) { shieldBubble.material.opacity = .14 + Math.sin(G.t * 4) * .05; shieldBubble.position.y = monkey.g.position.y + 1.1; }

  for (let i = decor.length - 1; i >= 0; i--) {

    const u = o.userData;

    if (u.sway) o.rotation.z = Math.sin(G.t * 1.5 + u.phase) * .15;
    if (u.swim) { o.position.z -= u.swim * dt; o.position.x += Math.sin(G.t + u.phase) * .01; }

  }

    gate.position.z += dz;
    if (!gate.userData.done) {
      const near = gate.position.z > -40;
      ['glow0', 'glow1'].forEach(k => gate.userData[k].material.opacity = near ? .25 + Math.sin(G.t * 8) * .15 : .2);

    }

  }
  if (!gate || gate.userData.done) $('laneHint').classList.add('hidden');
  const gateZ = gate ? gate.position.z : -999;
  const nearGate = z => gate && Math.abs(gateZ - z) < 16;

  // engeller
  if (!G.chase && (!G.riding || G.riding === 'kaykay')) {

        if (G.correct >= 4 && Math.random() < .3) { const l2 = (l1 + rndi(1, 2)) % 3; spawnObstacle(SPAWN_Z, l2); }
        if (Math.random() < .5) { const lb = (l1 + 1) % 3; spawnBananas(lb, SPAWN_Z + 6, 5, .9, false); }
        else spawnBananas(l1, SPAWN_Z + 8, 6, .9, true);

    else if (!nearGate(SPAWN_Z) && !G.chase) { spawnBananas(rndi(0, 2), SPAWN_Z, rndi(4, 7), .9, false); G.banNext = rnd(16, 26); }

  moveAll(obstacles, dz); moveAll(bananas, dz); moveAll(pickups, dz);

  // çarpışma: engel

    if (o.userData.hit || !o.parent) continue;
    if (Math.abs(o.position.z) < .75 && Math.abs(o.position.x - G.px) < 1) {
      if (G.riding === 'kaykay') { smash(o); addXp(2); continue; }
      if (G.riding) continue;
      const k = o.userData.kind;
      if (k === 'log' && G.py > .55) continue;
      o.userData.hit = true; hurt(o);
    }
  }
  obstacles = obstacles.filter(o => o.parent);
  // muz
  const magnet = powerOn('magnet');
  const pc = new V3(G.px, G.py + 1, 0);
  for (const b of bananas) {
    if (!b.parent) continue;
    b.rotation.y += dt * 4;
    if (magnet) { const d = b.position.distanceTo(pc); if (d < 6 && b.position.z > -6) { b.position.lerp(pc, damp(8, dt)); } }
    if (Math.abs(b.position.z) < .9 && Math.abs(b.position.x - G.px) < .95 && Math.abs(b.position.y - pc.y) < 1.5) collectBanana(b);
  }
  bananas = bananas.filter(b => b.parent);
  if (G.comboT > 0) G.comboT -= dt;
  // araç kutusu
  for (const p of pickups) {
    if (!p.parent) continue;
    p.userData.v.rotation.y += dt * 2; p.userData.ring.rotation.z += dt * 3; p.position.y = 1.3 + Math.sin(G.t * 3) * .2;
    if (Math.abs(p.position.z) < 1.1 && Math.abs(p.position.x - G.px) < 1.1 && !G.riding && !G.chase) { burst(p.position, 30, [0x9be7ff, 0xffd23f, 0xffffff], 6, .9); scene.remove(p); startRide(p.userData.kind); }
  }
  pickups = pickups.filter(p => p.parent);

  // parçacıklar
  updateParts(dt);
  // hava
  updateWeather(dt);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
  $('bananaCount').textContent = G.bananasRun;
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i], u = p.userData; u.life -= dt;
    u.v.y += u.g * dt; p.position.addScaledVector(u.v, dt); p.rotation.x += u.spin * dt; p.rotation.y += u.spin * dt;
    p.scale.multiplyScalar(1 - dt * .8);
    if (u.life <= 0) { scene.remove(p); parts.splice(i, 1); }
  }
}
function updateWeather(dt) {
  const cx = camera.position.x, cz = camera.position.z, cy = Math.max(0, camera.position.y - 8);
  if (rain.visible) {
    const a = rain.geometry.attributes.position.array, sp = G.weather === 'storm' ? 34 : 26;
    for (let i = 0; i < RAIN_N; i++) { const o = i * 6; a[o + 1] -= sp * dt; a[o + 4] -= sp * dt; a[o + 2] += G.speed * dt * .3; a[o + 5] += G.speed * dt * .3; if (a[o + 1] < cy || a[o + 2] > 12) { const x = cx + rnd(-18, 18), y = cy + rnd(14, 24), z = cz + rnd(-50, 0); a[o] = x; a[o + 1] = y; a[o + 2] = z; a[o + 3] = x - .12; a[o + 4] = y - 1; a[o + 5] = z; } }
    rain.geometry.attributes.position.needsUpdate = true;
  }
  if (snow.visible) {
    const a = snow.geometry.attributes.position.array;
    for (let i = 0; i < SNOW_N; i++) { const o = i * 3; a[o + 1] -= 2.5 * dt; a[o] += Math.sin(G.t + i) * .01; a[o + 2] += G.speed * dt * .3; if (a[o + 1] < cy || a[o + 2] > 12) { a[o] = cx + rnd(-18, 18); a[o + 1] = cy + rnd(10, 22); a[o + 2] = cz + rnd(-50, 0); } }
    snow.geometry.attributes.position.needsUpdate = true;
  }
  if (bubbles.visible) {
    const a = bubbles.geometry.attributes.position.array;
    for (let i = 0; i < BUB_N; i++) { const o = i * 3; a[o + 1] += 2 * dt; a[o + 2] += G.speed * dt * .5; if (a[o + 1] > 12 || a[o + 2] > 10) { a[o] = G.px + rnd(-14, 14); a[o + 1] = rnd(0, 2); a[o + 2] = rnd(-40, 0); } }
    bubbles.geometry.attributes.position.needsUpdate = true;
  }
  if (G.weather === 'storm' && !G.underwater && !G.space) {
    G.lightningT -= dt;
    if (G.lightningT <= 0) { G.lightningT = rnd(4, 8); flash('#ffffff', .8, 250); G.flashT = 1; setTimeout(() => Audio.thunder(), rnd(150, 600)); }
  }
  if (G.flashT > 0) G.flashT = Math.max(0, G.flashT - dt * 4);
}

/* ---- menü / garaj sahnesi ---- */
function updateIdle(dt) {
  G.t += dt;
  playerRoot.position.set(0, G.state === 'garage' ? 0 : 0, 0); playerRoot.rotation.set(0, Math.PI, 0);
  if (G.state === 'garage') {
    const v = vehicleHolder.children[0];
    playerRoot.rotation.y = Math.PI + G.t * .0;
    if (v) { v.position.y = (v.userData.kind === 'kaykay' || v.userData.kind === 'tekne') ? 0 : 1 + Math.sin(G.t * 2) * .1; monkey.g.position.y = v.position.y + v.userData.seat; poseMonkey(v.userData.pose, G.t); if (v.userData.flames) v.userData.flames.forEach(f => f.scale.y = rnd(.7, 1.3)); if (v.userData.prop) v.userData.prop.rotation.z += dt * 10; }
  } else { monkey.g.position.y = 0; poseMonkey('wave', G.t); }
  shadow.position.set(0, .02, 0); shadow.scale.setScalar(1); shadow.visible = true;
  roadMat.map.offset.y += dt * .3 / ROAD_TILE * 0;
  updateParts(dt);
}

/* =====================================================================
   EKRANLAR
   ===================================================================== */
function show(id) { ['menu', 'garage', 'pause', 'over'].forEach(s => $(s).classList.toggle('hidden', s !== id)); $('hud').classList.toggle('hidden', !(id === null || id === 'pause')); }
function clearRunObjects() {
  [obstacles, bananas, pickups, leaving].forEach(l => l.forEach(o => scene.remove(o)));
  obstacles = []; bananas = []; pickups = []; leaving = [];
  if (gate) { disposeObj(gate); gate = null; } if (chaser) { scene.remove(chaser); chaser = null; }
  vehicleHolder.clear(); Audio.stopLoop(); Audio.stopChaseLoop();
}
function goMenu() {
  clearRunObjects(); G.state = 'menu'; G.riding = null; G.chase = null; G.underwater = false; G.space = false; G.boatWater = false;
  G.weather = 'sunny'; setBiome(0, false); applyEnv(0, true);
  playerRoot.rotation.set(0, Math.PI, 0); monkey.g.visible = true; shieldBubble.visible = false;
  show('menu'); refreshMenu(); Audio.stopMusic();
  Device.back = () => Device.exitApp();
}
function refreshMenu() {
  const xp = Save.d.xp, L = levelOf(xp);
  $('mLv').textContent = L; $('mLvText').textContent = 'Seviye ' + L;
  $('mXp').style.width = (100 * (xp - xpFor(L)) / (xpFor(L + 1) - xpFor(L))) + '%';
  const nu = nextUnlock(L); $('mNext').textContent = nu ? `Sv ${nu.lv}: ${nu.list.map(x => x.item.icon + ' ' + x.item.name).join(', ')}` : 'Tüm ödüller açıldı!';
  $('mStats').textContent = `🍌 ${Save.d.bananas} muz  •  En iyi: ${Save.d.best} doğru`;
  document.querySelectorAll('.seg').forEach(b => b.classList.toggle('on', b.dataset.mode === Save.d.mode));
  $('muteBtn').textContent = Save.d.muted ? '🔇' : '🔊';
}
let gTab = 'vehicle';
function goGarage() {
  G.state = 'garage'; show('garage'); renderGarage(); garagePreview();
  Device.back = () => goMenu();
}
function garagePreview() { vehicleHolder.clear(); const v = buildVehicle(Save.d.vehicle); vehicleHolder.add(v); }
function renderGarage() {
  const L = levelOf(Save.d.xp); $('gLv').textContent = 'Sv ' + L;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === gTab));
  const grid = $('itemGrid'); grid.innerHTML = '';
  ITEMS[gTab].forEach(it => {
    const locked = it.lv > L;
    const sel = gTab === 'power' ? (!locked && Save.d[it.id]) : Save.d[gTab] === it.id;
    const c = document.createElement('div'); c.className = 'card' + (sel ? ' sel' : '') + (locked ? ' locked' : '');
    c.innerHTML = `<div class="ic">${it.icon}</div><div class="nm">${it.name}</div>` + (locked ? `<div class="lock"><span>🔒</span>Sv ${it.lv}</div>` : '');
    c.onclick = () => {
      Audio.init();
      if (locked) { Audio.wrong(); $('itemInfo').textContent = `${it.name}: Seviye ${it.lv}'te açılır`; return; }
      if (gTab === 'power') Save.d[it.id] = !Save.d[it.id]; else Save.d[gTab] = it.id;
      Save.save(); equip(); garagePreview(); Audio.lane(); Audio.pickup();
      $('itemInfo').textContent = `${it.icon} ${it.name}: ${it.desc}`; renderGarage();
    };
    grid.appendChild(c);
  });
  const cur = gTab === 'power' ? null : itemById(gTab, Save.d[gTab]);
  if (cur) $('itemInfo').textContent = `${cur.icon} ${cur.name}: ${cur.desc}`;
}
function startGame() {
  Audio.init(); Device.fullscreen(); Device.keepAwake();
  clearRunObjects(); resetRun(); equip();
  G.state = 'play'; playerRoot.rotation.set(0, 0, 0); playerRoot.position.set(0, 0, 0); monkey.g.position.set(0, 0, 0);
  setBiome(0, false); applyEnv(0, true);
  camPos.set(0, 3, 4); camLook.set(0, 1.2, -8);
  show(null); hudAll(); showQuestion(null); $('rideBar').classList.add('hidden');
  Audio.startMusic('run');
  banner(Save.d.runs === 0 ? 'Muzları topla!<small>← → dokun: yol değiştir • ↑ kaydır: zıpla</small>' : 'Haydi koş!', 'gold', 2600);
  Save.d.runs++; Save.save();
  G.camEvent = { type: 'pano', t: 0, dur: 2 };
  Device.back = () => pauseGame();
}
function pauseGame() {
  if (G.state !== 'play') return;
  G.state = 'paused'; show('pause'); $('hud').classList.remove('hidden');
  if (Audio.ctx) Audio.ctx.suspend();
  $('pMuteBtn').textContent = Save.d.muted ? '🔇 SES KAPALI' : '🔊 SES AÇIK';
  Device.back = () => goMenu();
}
function resumeGame() { G.state = 'play'; show(null); if (Audio.ctx) Audio.ctx.resume(); Device.back = () => pauseGame(); }
function gameOver() {
  if (G.state !== 'play') return;
  G.state = 'over'; Audio.stopMusic(); Audio.stopLoop(); Audio.stopChaseLoop(); Audio.setAmbient('x', 'x', null);
  Save.d.best = Math.max(Save.d.best, G.correct); Save.save();
  setTimeout(() => {
    show('over');
    $('ovCorrect').textContent = G.correct; $('ovBanana').textContent = G.bananasRun; $('ovXp').textContent = '+' + G.xpRun;
    const xp = Save.d.xp, L = levelOf(xp); $('ovLv').textContent = L; $('ovLvText').textContent = 'Seviye ' + L;
    $('ovXpBar').style.width = '0%'; setTimeout(() => $('ovXpBar').style.width = (100 * (xp - xpFor(L)) / (xpFor(L + 1) - xpFor(L))) + '%', 100);
    $('ovUnlock').textContent = G.unlockedRun.length ? 'Yeni açılanlar: ' + G.unlockedRun.map(x => x.item.icon + ' ' + x.item.name).join(', ') : (nextUnlock(L) ? `Sonraki ödül Sv ${nextUnlock(L).lv}'te` : '');
    Audio.tone(523, .2, 'sine', .2); Audio.tone(659, .2, 'sine', .2, .15); Audio.tone(784, .4, 'sine', .2, .3);
  }, 700);
  Device.back = () => goMenu();
}

/* ---- düğmeler ---- */
$('playBtn').onclick = () => startGame();
$('garageBtn').onclick = () => { Audio.init(); goGarage(); };
$('gBack').onclick = () => goMenu();
$('muteBtn').onclick = () => { Audio.init(); Audio.setMuted(!Save.d.muted); refreshMenu(); };
document.querySelectorAll('.seg').forEach(b => b.onclick = () => { Audio.init(); Save.d.mode = b.dataset.mode; Save.save(); refreshMenu(); Audio.lane(); });
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { gTab = b.dataset.tab; renderGarage(); Audio.lane(); });
$('pauseBtn').onclick = e => { e.stopPropagation(); pauseGame(); };
$('resumeBtn').onclick = () => resumeGame();
$('pMuteBtn').onclick = () => { Audio.setMuted(!Save.d.muted); $('pMuteBtn').textContent = Save.d.muted ? '🔇 SES KAPALI' : '🔊 SES AÇIK'; };
$('pMenuBtn').onclick = () => { if (Audio.ctx) Audio.ctx.resume(); goMenu(); };
$('againBtn').onclick = () => startGame();
$('oGarageBtn').onclick = () => { goMenu(); goGarage(); };
$('oMenuBtn').onclick = () => goMenu();

/* ---- dokunmatik / klavye ---- */
let touch = null;
window.addEventListener('touchstart', e => { if (G.state !== 'play') return; const t = e.changedTouches[0]; touch = { x: t.clientX, y: t.clientY }; }, { passive: true });
window.addEventListener('touchend', e => {
  if (G.state !== 'play' || !touch) return; const t = e.changedTouches[0];
  const dx = t.clientX - touch.x, dy = t.clientY - touch.y; touch = null;
  if (Math.abs(dy) > 35 && Math.abs(dy) > Math.abs(dx) && dy < 0) { jump(); return; }
  if (Math.abs(dx) > 30) { setLane(G.lane + (dx > 0 ? 1 : -1)); return; }
  if (Math.abs(dx) < 15 && Math.abs(dy) < 15) setLane(G.lane + (t.clientX > window.innerWidth / 2 ? 1 : -1));
}, { passive: true });
canvas.addEventListener('mousedown', e => { if (G.state !== 'play' || ('ontouchstart' in window)) return; setLane(G.lane + (e.clientX > window.innerWidth / 2 ? 1 : -1)); });
window.addEventListener('keydown', e => {
  if (G.state !== 'play') return;
  if (e.key === 'ArrowLeft' || e.key === 'a') setLane(G.lane - 1);
  if (e.key === 'ArrowRight' || e.key === 'd') setLane(G.lane + 1);
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') jump();
  if (e.key === 'p') pauseGame();
});

/* =====================================================================
   DÖNGÜ
   ===================================================================== */
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05);
  if (G.state === 'play') updatePlay(dt);
  else if (G.state === 'menu' || G.state === 'garage') updateIdle(dt);
  else if (G.state === 'over') { G.t += dt; updateParts(dt); poseMonkey('idle', G.t); }
  if (G.state !== 'paused') { applyEnv(dt); updateCamera(dt); }
  renderer.render(scene, camera);
}
Device.setup();
resetRun();
goMenu();
frame();
</script>
